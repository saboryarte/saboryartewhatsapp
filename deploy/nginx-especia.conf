# nginx para Especia (docs/despliegue/servidor.md). deploy/instalar.sh lo copia a /etc/nginx/sites-available/especia.conf
# y certbot le agrega https (listen 443 y certificados) en este mismo archivo.
server {
    listen 80;
    listen [::]:80;
    server_name especia.mariomora.tech;

    # Avisos de Meta y Bold, formularios del equipo y la página de conexión: todo es pequeño.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
